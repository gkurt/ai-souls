# Turn pending changelogs into a release.
#
# Two steps, both on `main`:
#
#   1. `tegami ci` sees `.tegami/*.md` and opens a `chore: release
#      v<version>` PR that bumps `npm/package.json` + `app.zon` and
#      writes CHANGELOG.md.
#   2. Merging that PR lands a new version on main, and the tag job below
#      pushes `v<version>` and then dispatches `release.yml`, the only
#      workflow with the binaries. It has to ask explicitly — see the
#      comment on that step.
#
# Tegami does not publish anything here. The npm package does not exist
# as a directory in this repo; it is assembled from binaries built on two
# other runners. See the note in scripts/tegami.mts.

name: Version

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: version-${{ github.ref }}

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version packages
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version branch
      pull-requests: write # open the release PR
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Version
        run: bun run tegami ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

  tag:
    name: Tag a new version
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag
      actions: write # and then ask release.yml to run on it
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Idempotent on purpose: this runs on every push to main, and does
      # nothing at all unless the version on main is one we have never
      # tagged. That happens exactly when a release PR merges.
      - name: Tag if the version is new
        id: tag
        run: |
          set -euo pipefail
          version=$(node -p "require('./npm/package.json').version")
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists — nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "${tag}"
          git push origin "${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "pushed ${tag}"

      # The tag above does NOT start release.yml on its own. Anything
      # pushed with GITHUB_TOKEN is invisible to `on: push`, which is how
      # GitHub stops a workflow triggering itself forever — the same rule
      # that leaves the release PR without CI. It cost us the
      # v0.1.0 release: the tag landed and nothing built.
      #
      # `workflow_dispatch` is the one documented exception to that rule,
      # so we ask for the run by name. Dispatching against the TAG and
      # not a branch is what matters: every job in release.yml gates on
      # `startsWith(github.ref, 'refs/tags/v')`.
      - name: Start the release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # The ref can take a moment to be visible to the API after a
          # push, and a release that silently did not happen is the
          # failure mode this whole step exists to prevent.
          for attempt in 1 2 3 4 5; do
            if gh workflow run release.yml --ref "$TAG"; then
              echo "release.yml dispatched against ${TAG}"
              exit 0
            fi
            echo "attempt ${attempt} failed; the tag may not be visible yet"
            sleep 5
          done
          echo "::error::could not start release.yml — run: gh workflow run release.yml --ref ${TAG}"
          exit 1
