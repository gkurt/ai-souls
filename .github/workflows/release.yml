# Build the binary on each platform, then stage one npm package that
# carries all of them.
#
# This workflow exists because the Windows machine this project was
# written on cannot produce the macOS binary: that target needs Apple's
# SDK, which only a macOS host has. Without a green run here, `dist/npm`
# has a win32-x64 slot and nothing else, and the launcher says so
# plainly on any other platform.
#
# `version.yml` starts it: when a release PR merges, that
# workflow pushes the `v*` tag and then dispatches this one against it.
# The dispatch is not belt-and-braces — a tag pushed with GITHUB_TOKEN
# never fires `on: push`, so without it nothing here would ever run
# automatically. The human decision is merging the PR.
#
# The `push: tags` trigger below is still worth having: it catches a tag
# pushed by a person. `ci.yml` covers ordinary pushes.
#
# The GitHub release is left as a DRAFT: the assets are persisted and the
# notes are written, and a person decides whether the world sees it.
#
# The npm publish is off until the `NPM_PUBLISH` repository variable is
# `true`, because it needs one-time trusted-publishing setup on npmjs.com
# first (see CONTRIBUTING.md). Until then a tag builds and drafts, and
# the publish job skips with a note.

name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, because the SDK version decides both the toolchain and the
  # generated build graph. An unpinned `npm install -g` would make the
  # difference between two builds invisible.
  NATIVE_SDK_VERSION: "0.8.1"
  # Only Windows needs this spelled out — see the install step.
  ZIG_VERSION: "0.16.0"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build ${{ matrix.slot }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Explicit targets rather than the native default, in both
          # rows. `standardTargetOptions` with no `-Dtarget` resolves to
          # the host WITH its detected CPU features, so a runner that
          # happens to have AVX-512 would emit a binary that crashes on
          # a machine that does not. Naming the target pins the baseline.
          #
          # `-gnu` and not `-msvc`: Zig carries mingw-w64 itself, so the
          # build does not depend on which Visual Studio the runner
          # image shipped this month. It is also what the dev machine
          # builds, so CI and local are the same binary.
          - runner: windows-latest
            slot: win32-x64
            exe: ai-souls.exe
            targets: x86_64-windows-gnu
          # One universal binary instead of two arch slots: Apple
          # Silicon and Intel out of a single ~12 MB file, which is
          # smaller than shipping both separately and leaves nothing to
          # resolve at install time.
          - runner: macos-14
            slot: darwin-universal
            exe: ai-souls
            targets: aarch64-macos x86_64-macos
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write # sign the attestation
      attestations: write # and record it against the repo
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install the Native SDK
        run: npm install -g "@native-sdk/cli@${NATIVE_SDK_VERSION}"

      # The SDK downloads a managed Zig for macOS but has none for
      # Windows, where it expects to find one on PATH and stops if it
      # cannot.
      - name: Install Zig
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          zig="zig-x86_64-windows-${ZIG_VERSION}"
          curl -fsSL -o zig.zip "https://ziglang.org/download/${ZIG_VERSION}/${zig}.zip"
          7z x -y -o"$RUNNER_TEMP" zig.zip > /dev/null
          echo "${RUNNER_TEMP}/${zig}" >> "$GITHUB_PATH"

      # The SDK is a path dependency compiled from source on every cold
      # build, which is most of the wall clock here.
      - uses: actions/cache@v4
        with:
          path: |
            .native/build/.zig-cache
            ~/.cache/zig
            ~/AppData/Local/zig
          key: zig-${{ matrix.slot }}-${{ env.NATIVE_SDK_VERSION }}-${{ hashFiles('src/**', 'app.zon') }}
          restore-keys: |
            zig-${{ matrix.slot }}-${{ env.NATIVE_SDK_VERSION }}-

      - run: native check

      # The suite is platform-independent, but a compile failure on a
      # host nobody develops on is exactly what this job exists to find.
      - run: native test --yes

      - name: Build every slice
        run: |
          set -euo pipefail
          mkdir -p out
          for target in ${{ matrix.targets }}; do
            echo "::group::$target"
            native build --yes -Dtrace=off -Dtarget="$target"
            mv "zig-out/bin/${{ matrix.exe }}" "out/$target"
            echo "::endgroup::"
          done

      - name: Fuse the slices into one binary
        run: |
          set -euo pipefail
          cd out
          slices=(*)
          if [ "${#slices[@]}" -eq 1 ]; then
            mv "${slices[0]}" "${{ matrix.exe }}"
          else
            lipo -create -output "${{ matrix.exe }}" "${slices[@]}"
            rm -f "${slices[@]}"
            # A universal binary that quietly lost a slice is worse than
            # a failed build: it installs fine and dies on someone
            # else's laptop.
            for want in ${{ matrix.targets }}; do
              arch="${want%%-*}"
              if [ "$arch" = "aarch64" ]; then arch=arm64; fi
              lipo -archs "${{ matrix.exe }}" | tr ' ' '\n' | grep -qx "$arch" \
                || { echo "missing $arch slice"; exit 1; }
            done
            lipo -archs "${{ matrix.exe }}"
          fi
          ls -l "${{ matrix.exe }}"

      # Signed here rather than anywhere downstream, because this is the
      # only place the binary has just been built from a known commit by
      # a known workflow — that is the whole claim. Attestation is by
      # digest, so the artifact round trip and the rename into
      # `ai-souls-v1.2.3-win32-x64.exe` do not disturb it.
      #
      #   gh attestation verify <file> --repo gkurt/ai-souls
      #
      # For macOS this deliberately runs AFTER `lipo`: the fused binary
      # is the thing people download, and neither slice is.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/${{ matrix.exe }}

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.slot }}
          path: out/${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 90

  package:
    name: package
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: binary-*

      # A tag that disagrees with the manifest would publish a package
      # whose version does not match the tag people downloaded it under.
      # (app.zon is checked against the same number by the packager.)
      - name: Check the tag against the manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version=$(node -p "require('./npm/package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in npm/package.json"
            exit 1
          fi

      # One slot per downloaded artifact, all into the same dist. The
      # upload/download round trip drops the executable bit; the
      # packager sets it again for the non-Windows slots.
      - name: Stage every slot
        run: |
          set -euo pipefail
          first=1
          for dir in binaries/binary-*; do
            slot="${dir#binaries/binary-}"
            exe="$dir/ai-souls"
            [ -f "$exe" ] || exe="$dir/ai-souls.exe"
            if [ $first -eq 1 ]; then
              node tools/package-npm.mjs --slot "$slot" --binary "$exe"
              first=0
            else
              node tools/package-npm.mjs --keep --slot "$slot" --binary "$exe"
            fi
          done

      - name: Pack
        working-directory: dist/npm
        run: npm pack

      # npm attaches its own provenance at publish time, but the same
      # tarball is a GitHub release asset, and someone who downloads it
      # from there never goes near the registry.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/npm/*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: dist/npm/*.tgz
          if-no-files-found: error
          retention-days: 90

  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Artifact names are for this workflow; release assets are for
      # people, and land in a downloads folder next to everything else
      # they ever downloaded.
      - name: Name the assets
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/npm-tarball/*.tgz release/
          for dir in artifacts/binary-*; do
            slot="${dir#artifacts/binary-}"
            for found in "$dir"/*; do
              case "$found" in
                *.exe) cp "$found" "release/ai-souls-${GITHUB_REF_NAME}-${slot}.exe" ;;
                *)     cp "$found" "release/ai-souls-${GITHUB_REF_NAME}-${slot}" ;;
              esac
            done
          done
          ls -l release

      # The changelog was written for this exact version by Tegami, so
      # prefer it over generated commit notes. Fall back if the section
      # is missing — a hand-pushed tag has no changelog entry.
      - name: Take the notes from the changelog
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -f npm/CHANGELOG.md ]; then
            awk -v want="## ai-souls@${version}" '
              $0 == want { grab = 1; next }
              grab && /^## / { exit }
              grab { print }
            ' npm/CHANGELOG.md > notes.md
          fi
          if [ -s notes.md ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "no changelog section for ${version} — falling back to generated notes"
          fi

      # Draft, not published: the assets are persisted and the notes are
      # written, and a person decides whether the world sees it.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.notes.outputs.have }}
        run: |
          set -euo pipefail
          if [ "$NOTES" = "true" ]; then
            source_of_notes=(--notes-file notes.md)
          else
            source_of_notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            "${source_of_notes[@]}" \
            release/*

  publish:
    name: publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) — no NPM_TOKEN
    steps:
      # Not for building anything — for the npm that comes with it.
      # Trusted publishing needs npm 11.5.1 or newer to exchange the
      # OIDC token, and the runner image's default is not a promise.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: tarball

      - name: Show what is about to publish
        run: |
          set -euo pipefail
          npm --version
          ls -l tarball/

      # Gated by a repository variable rather than wired straight in, so
      # there is a switch to reach for that is not "revert a commit".
      #
      # The leading `./` is load-bearing. npm's spec parser reads a bare
      # `tarball/ai-souls-0.2.0.tgz` as the GitHub shorthand
      # `owner/repo` and goes off to `git ls-remote
      # ssh://git@github.com/tarball/ai-souls-0.2.0.tgz.git`, which is
      # how the v0.2.0 publish failed. A path that starts with `./` is
      # unambiguously a path.
      - name: Publish
        if: vars.NPM_PUBLISH == 'true'
        run: npm publish ./tarball/*.tgz --access public

      # Trusted publishing attaches provenance without being asked, so
      # there is no `--provenance` flag here. What the docs do not say is
      # whether that still holds when publishing a pre-built tarball
      # rather than a directory, and this is the only pipeline that can
      # answer it.
      #
      # Reported, not enforced. The package is already on the registry by
      # this point; failing the job would not take it back, and a red
      # release over a missing badge would teach the wrong lesson.
      - name: Did provenance land?
        if: vars.NPM_PUBLISH == 'true'
        run: |
          set -uo pipefail
          tarball=$(ls ./tarball/*.tgz)
          version=$(basename "$tarball" .tgz)
          version=${version#ai-souls-}
          for attempt in 1 2 3; do
            if npm view "ai-souls@${version}" --json 2>/dev/null | grep -q '"provenance"'; then
              echo "provenance attached to ai-souls@${version}"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::ai-souls@${version} published without provenance — trusted publishing may not generate it for a pre-built tarball. The GitHub attestation on the same tarball is unaffected."

      - name: Explain the skip
        if: vars.NPM_PUBLISH != 'true'
        run: |
          echo "NPM_PUBLISH is not 'true', so nothing was published."
          echo "The tarball is attached to the draft release."
